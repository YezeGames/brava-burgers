	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

	<script>
		// Mismo ID de Google Sheet que el Excel Pedilo (hojas: productos + configuracion)
		window.PEDILO_SHEET_ID = '1s3sZcKRqwpCH8L4N1xfgyba14s_HUC3F43FL5ekOCS0';
		window.PEDILO_SHEET_PRODUCTOS = 'productos';
		window.PEDILO_SHEET_CONFIG = 'configuracion';
		var g_productos = [];
		var g_telefono = '';
	</script>
	<script src="pedilo-data.js?v=3"></script>
	<link href="brava-brand.css?v=3" rel="stylesheet">

	<style>
		* { touch-action: manipulation; }
		.categoria_titulo { margin: 10px 0 20px; font-weight: 900; font-size: 20px; cursor: pointer; }
		.subcategoria_titulo { margin: 10px 0 20px; font-weight: 900; font-size: 16px; cursor: pointer; }
		.sidenav {
			height: 100%; width: 0; position: fixed; top: 0; right: 0;
			overflow-x: hidden; transition: 0.5s; padding-top: 60px; z-index: 1000000;
		}
		.sidenav-item { padding: 8px 8px 8px 32px; text-decoration: none; font-size: 22px; display: block; }
		.sidenav-closebtn { position: absolute; top: 0; right: 25px; font-size: 36px; }
		#footer_enviar {
			display: none; position: fixed; padding: 15px 0; left: 0; bottom: 0; width: 100%;
			text-align: center; z-index: 999;
		}
	</style>
	<style id="pedilo-theme"></style>
</head>

<body id="page-top">

	<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
		<div class="container" style="min-height:50px;">
			<div id="mySidenav" class="sidenav">
				<a href="javascript:void(0)" class="sidenav-closebtn" onclick="closeNav()">&times;</a>
				<div id="sidenav_categorias"></div>
			</div>
			<div style="position:absolute;">
				<a id="link_logo" href="./"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='95' fill='%231a1a1a' stroke='%23FF6B35' stroke-width='4'/%3E%3Ctext x='100' y='120' font-size='40' font-weight='bold' text-anchor='middle' fill='%23FF6B35' font-family='Arial'%3EBRAVA%3C/text%3E%3C/svg%3E" alt="Brava Burgers" style="border-radius:50%;height:50px;width:50px;"></a>
				<a id="link_titulo" class="navbar-brand" href="./" style="font-size:17px;"><font color="#FF6B35">BRAVA BURGERS</font></a>
			</div>
			<div style="padding-left:10px;z-index:999999;margin-left:auto;">
				<button class="btn btn-primary helper_changuito my-btn-primary" style="display:none;" type="button" onclick="mostrar_resumen_pedido();">
					<i id="icono_resumen_pedido" class="fas fa-shopping-cart"></i>
					<span class="badge badge-light pedido_productos_cantidad_total">0</span>
				</button>
				<button class="btn btn-primary my-btn-primary" id="boton_buscador" style="display:none;" type="button" onclick="mostrar_buscador();">
					<i class="fas fa-search"></i>
				</button>
				<button type="button" style="display:none;" onclick="openNav()" class="btn btn-primary my-btn-primary" id="mobile-nav-toggle">
					<i class="fa fa-bars"></i>
				</button>
			</div>
		</div>
	</nav>

	<div class="container" style="max-width:600px;">
		<div class="row" id="productos" style="margin-top:10px;">
			<div id="mipedido"></div>

			<div class="helper_resumen resumen_titulo col-md-12" style="font-weight:900;font-size:20px;display:none;">
				<a href="javascript:void(0)" onclick="mostrar_resumen_pedido();" class="btn btn-link" style="position:absolute;left:5px;margin-top:-5px;"><i class="fas fa-arrow-left"></i></a>
				<a href="javascript:void(0)" onclick="vaciar_pedido();" class="btn btn-link" style="position:absolute;right:5px;margin-top:-5px;"><i class="fas fa-trash"></i></a>
				<center>Tu pedido</center>
			</div>

			<div class="helper_buscador resumen_titulo col-md-12" style="font-weight:900;font-size:20px;display:none;">
				<a href="javascript:void(0)" onclick="mostrar_buscador();" class="btn btn-link" style="position:absolute;left:5px;margin-top:-5px;"><i class="fas fa-arrow-left"></i></a>
				<a href="javascript:void(0)" onclick="copiar_busqueda();" class="btn btn-link" style="position:absolute;left:34px;margin-top:-5px;"><i class="fas fa-copy"></i></a>
				<input type="search" id="input_buscador" class="form-control" style="margin-top:-4px;width:calc(100% - 62px);" placeholder="Texto a buscar" onkeyup="buscar();">
			</div>

			<div id="catalogo_dinamico" class="col-12"></div>
		</div>
	</div>

	<form id="form_pedido" style="display:none;">
		<input id="form_alias" name="alias" value="bravaburgers">
		<input id="form_url" name="url">
		<textarea id="form_order_text" name="order_text"></textarea>
	</form>

	<div id="popup_control_horario" style="display:none;border-radius:.5rem;">
		<center><div id="popup_control_horario_contenido" style="color:black;padding:15px;"></div></center>
	</div>

	<div id="popup_monto_minimo" style="display:none;border-radius:.5rem;">
		<center><div id="popup_monto_minimo_texto" style="color:black;padding:15px;"></div></center>
	</div>

	<div id="pregunta_vaciar_pedido" style="display:none;border-radius:.5rem;">
		<center>
			<h5 class="mb-3 brava-modal-title">¿Vaciar carrito?</h5>
			<button class="btn btn-danger" onclick="window.g_pedido.productos=[];g_viendo_resumen=true;mostrar_resumen_pedido();calcular_total();$.fancybox.close();">Si</button>
			<button class="btn btn-primary my-btn-primary" onclick="$.fancybox.close();">No</button>
		</center>
	</div>

	<div id="preguntas_pedido" style="display:none;border-radius:.5rem;">
		<div id="preguntas_pedido_encabezado" style="text-align:center;font-size:18px;margin-bottom:20px;">¡Completá los datos para que preparemos tu pedido!</div>
		<form onsubmit="finalizar_pedido(); return false;">
			<p><label id="pregunta_1_label">Nombre*</label><input type="text" id="pregunta_1_respuesta" class="form-control" required></p>
			<p><label id="pregunta_2_label">Dirección/Entre que calles?*</label><input type="text" id="pregunta_2_respuesta" class="form-control" required></p>
			<p><label id="pregunta_3_label">Localidad*</label><input type="text" id="pregunta_3_respuesta" class="form-control" required></p>
			<p><label id="pregunta_4_label">Piso/Dpto</label><input type="text" id="pregunta_4_respuesta" class="form-control"></p>
			<p><label id="pregunta_5_label">Como va a abonar?*</label><select id="pregunta_5_respuesta" class="form-control" required></select></p>
			<p><label id="pregunta_6_label">Selecciona el turno*</label><select id="pregunta_6_respuesta" class="form-control" required></select></p>
			<p><label id="pregunta_10_label">Lo enviamos a (seleccione la zona)*</label><select id="pregunta_10_respuesta" class="form-control" required onchange="calcular_total()"></select></p>
			<div id="preguntas_pedido_pie" style="text-align:center;font-size:16px;margin:15px 0;"></div>
			<p class="text-center mb-0"><input type="submit" class="btn btn-primary my-btn-primary" value="Enviar Pedido"></p>
		</form>
	</div>

	<div id="pregunta_variedades" style="display:none;border-radius:.5rem;">
		<h5 class="mb-3" id="pregunta_variedades_titulo">Elija una opción</h5>
		<span id="pregunta_variedades_opciones"></span>
	</div>

	<footer class="footer text-center">
		<div class="container">
			<div id="footer_pedilo_contenido" class="py-4"></div>
			<div style="opacity:.4;padding-bottom:70px;">
				Sistema Pedilo-compatible · Brava Burgers
				<span id="sync_status" style="display:block;font-size:11px;margin-top:4px;"></span>
			</div>
		</div>
	</footer>

	<div id="footer_enviar">
		<a href="javascript:void(0)" onclick="enviar_pedido()" class="btn my-btn-primary" id="boton_enviar">Enviar pedido</a>
	</div>
	<div class="helper_footer_padding" style="height:70px;display:none;"></div>

	<script src="pedilo-shop.js?v=3"></script>
</body>
</html>
