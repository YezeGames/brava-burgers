<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Brava — Comanda</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			background: #1a1a1a;
			color: #fff;
			font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
			padding: 24px 16px 48px;
		}
		.preview-bar {
			max-width: 320px;
			margin: 0 auto 16px;
			text-align: center;
		}
		.preview-bar h1 {
			font-size: 1rem;
			font-weight: 600;
			color: #FF6B35;
			margin: 0 0 8px;
		}
		.preview-bar p {
			font-size: 0.85rem;
			color: #aaa;
			margin: 0 0 12px;
		}
		.preview-bar button {
			background: #FF6B35;
			color: #fff;
			border: none;
			padding: 10px 20px;
			border-radius: 8px;
			font-weight: 600;
			cursor: pointer;
		}
		.preview-bar button:hover { background: #E55A25; }
		.preview-bar .err { color: #ff8a80; font-size: 0.9rem; }

		.ticket-wrap {
			width: 80mm;
			max-width: 80mm;
			margin: 0 auto;
			box-shadow: 0 8px 32px rgba(0,0,0,.5);
		}
		.ticket.ticket-comanda {
			background: #fff;
			color: #000;
			font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
			font-size: 0.78rem;
			line-height: 1.4;
			padding: 0;
			width: 100%;
		}
		.ticket-comanda .comanda-top {
			background: #000;
			color: #fff;
			padding: 10px 8px;
			text-align: center;
		}
		.ticket-comanda .comanda-top .brand {
			font-size: 1.05rem;
			font-weight: 800;
			letter-spacing: 0.04em;
		}
		.ticket-comanda .comanda-top .meta {
			font-size: 0.7rem;
			line-height: 1.45;
			margin-top: 6px;
			text-align: left;
		}
		.ticket-comanda .comanda-body { padding: 8px; }
		.ticket-comanda .bold { font-weight: 700; }
		.ticket-comanda .line { border-top: 1px dashed #ccc; margin: 8px 0; }
		.ticket-comanda .section-title {
			font-weight: 700;
			font-size: 0.65rem;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: #666;
			margin: 4px 0 6px;
		}
		.ticket-comanda .item { margin: 8px 0; }
		.ticket-comanda .item-name { font-weight: 700; font-size: 0.82rem; }
		.ticket-comanda .item-detail,
		.ticket-comanda .item-aclaracion { font-size: 0.75rem; font-weight: 700; margin-top: 2px; }
		.ticket-comanda .item-extras { font-weight: 700; }
		.ticket-comanda .row {
			display: flex;
			justify-content: space-between;
			gap: 8px;
			font-variant-numeric: tabular-nums;
		}
		.ticket-comanda .total-row { font-weight: 700; font-size: 0.88rem; }
		.ticket-comanda .pago-line { font-weight: 700; margin: 4px 0; }
		.ticket-comanda .edit-note { font-size: 0.68rem; font-weight: 700; margin-top: 6px; }
		.ticket-comanda .comanda-foot {
			background: #000;
			color: #fff;
			font-size: 0.62rem;
			text-align: center;
			padding: 8px 6px;
		}

		@media print {
			body { background: #fff; padding: 0; }
			.preview-bar { display: none; }
			.ticket-wrap { max-width: none; box-shadow: none; margin: 0; width: 80mm; }
			.ticket.ticket-comanda {
				width: 80mm;
				padding: 0;
				font-size: 11px;
				-webkit-print-color-adjust: exact;
				print-color-adjust: exact;
			}
			.ticket-comanda .comanda-top,
			.ticket-comanda .comanda-foot {
				background: #000 !important;
				color: #fff !important;
				-webkit-print-color-adjust: exact;
				print-color-adjust: exact;
			}
			@page { size: 80mm auto; margin: 0; }
		}
	</style>
</head>
<body>
	<div class="preview-bar">
		<h1 id="bar-title">Comanda — Brava Burgers</h1>
		<p class="sub" id="bar-sub">Página alternativa — preferí <strong>Ticket</strong> en el panel admin (misma ventana).</p>
		<button type="button" id="btn-print">Imprimir comanda</button>
		<p class="err hidden" id="bar-err"></p>
	</div>

	<div class="ticket-wrap">
		<article class="ticket ticket-comanda" id="ticket-root" aria-label="Comanda térmica"></article>
	</div>

	<script src="/admin/comanda.js?v=7"></script>
</body>
</html>
