<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex,nofollow">
	<title>Brava — Órdenes</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link href="/brava-brand.css?v=14" rel="stylesheet">
	<style>
		body { padding: 24px 16px; background: #f5f5f5; color: #333; }
		.card { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
		h1 { font-size: 1.5rem; margin-bottom: 16px; }
		.login { max-width: 360px; margin: 80px auto; }
		.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
		.tab { padding: 8px 14px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 6px; }
		.tab.active { border-color: #FF6B35; font-weight: 600; }
		table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
		th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; }
		.actions { display: flex; flex-wrap: wrap; gap: 6px; }
		.btn-sm { padding: 6px 10px; font-size: 0.75rem; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
		.btn-wa { background: #25D366; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; text-decoration: none; }
		.btn-ok { color: #2e7d32; border-color: #2e7d32; font-weight: 700; }
		.btn-x { color: #c62828; border-color: #c62828; font-weight: 700; }
		.err { color: #c62828; font-size: 0.85rem; margin-top: 8px; }
		.sound-bar { margin-bottom: 16px; padding: 10px; background: #f9f9f9; border-radius: 6px; font-size: 0.85rem; }
		.hidden { display: none !important; }
	</style>
</head>
<body>
	<div id="login-view" class="login card">
		<h1>Brava — Admin</h1>
		<p><label>Usuario<br><input type="text" id="login-user" class="form-control brava-input" autocomplete="username"></label></p>
		<p><label>Contraseña<br><input type="password" id="login-pass" class="form-control brava-input" autocomplete="current-password"></label></p>
		<button type="button" class="btn btn-primary my-btn-primary" id="login-btn">Entrar</button>
		<p class="err" id="login-err" hidden></p>
	</div>

	<div id="app-view" class="hidden">
		<div class="card">
			<h1>Órdenes <button type="button" class="btn-sm float-right" id="logout-btn">Salir</button></h1>
			<div class="sound-bar">
				<button type="button" class="btn-sm" id="btn-sound">Activar sonido</button>
				<span id="poll-status" style="margin-left:8px;color:#666;"></span>
			</div>
			<div class="tabs">
				<button type="button" class="tab active" data-estado="activa">Activas</button>
				<button type="button" class="tab" data-estado="entregada">Entregados</button>
				<button type="button" class="tab" data-estado="cancelada">Cancelados</button>
			</div>
			<div style="overflow-x:auto">
				<table>
					<thead>
						<tr>
							<th>Fecha</th><th>Cliente</th><th>Teléfono</th><th>Pago</th><th>Total</th><th>ORN</th><th>Acciones</th>
						</tr>
					</thead>
					<tbody id="tbody"></tbody>
				</table>
			</div>
			<p class="err" id="app-err" hidden></p>
		</div>
	</div>

	<script src="/admin/admin.js?v=2"></script>
</body>
</html>
