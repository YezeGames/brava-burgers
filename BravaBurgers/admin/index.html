<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex,nofollow">
	<title>Brava — Órdenes</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<style>
		body {
			margin: 0;
			padding: 24px 16px !important;
			background: #f5f5f5 !important;
			color: #333 !important;
		}
		.card { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); color: #333; }
		h1 { font-size: 1.5rem; margin-bottom: 16px; color: #1a1a1a; }
		label { color: #333; }
		.login { max-width: 360px; margin: 80px auto; }
		.brava-input {
			width: 100%;
			box-sizing: border-box;
			padding: 10px 12px;
			border: 1px solid #ccc;
			border-radius: 6px;
			font-size: 1rem;
			color: #333;
			background: #fff;
		}
		#login-btn {
			margin-top: 8px;
			width: 100%;
			padding: 10px 16px;
			font-size: 1rem;
			font-weight: 600;
			color: #fff !important;
			background: #FF6B35;
			border: none;
			border-radius: 6px;
			cursor: pointer;
		}
		#login-btn:hover { background: #E55A25; }
		#login-btn:disabled { opacity: 0.7; cursor: wait; }
		.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
		.tab { padding: 8px 14px; border: 1px solid #ddd; background: #fff; color: #333; cursor: pointer; border-radius: 6px; }
		.tab.active { border-color: #FF6B35; font-weight: 600; color: #1a1a1a; }
		table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #333; }
		th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; color: #333; }
		th { color: #1a1a1a; font-weight: 600; }
		.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
		.btn-sm { padding: 6px 10px; font-size: 0.75rem; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; color: #333; }
		.btn-wa { background: #25D366; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; text-decoration: none; display: inline-flex; align-items: center; }
		.btn-ok { color: #2e7d32; border-color: #2e7d32; font-weight: 700; min-width: 2rem; }
		.btn-x { color: #c62828; border-color: #c62828; font-weight: 700; min-width: 2rem; }
		.err { font-size: 0.85rem; margin-top: 8px; }
		#app-err, #login-err { color: #c62828 !important; font-weight: 600; }
		.sound-bar { margin-bottom: 16px; padding: 10px; background: #f9f9f9; border-radius: 6px; font-size: 0.85rem; color: #333; }
		#poll-status { color: #666 !important; }
		.hidden { display: none !important; }
		#logout-btn { float: right; }
		.modal-backdrop {
			position: fixed; inset: 0; background: rgba(0,0,0,.45);
			display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100;
		}
		.modal-backdrop.hidden { display: none !important; }
		.modal {
			background: #fff; border-radius: 8px; max-width: 480px; width: 100%;
			padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,.2); color: #333;
		}
		.modal h2 { margin: 0 0 4px; font-size: 1.15rem; color: #1a1a1a; }
		.modal .sub { font-size: 0.8rem; color: #666; margin-bottom: 14px; }
		.modal label.field { display: block; font-size: 0.75rem; color: #666; margin: 10px 0 4px; }
		.modal textarea {
			width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc;
			border-radius: 4px; font-size: 0.9rem; min-height: 72px; resize: vertical; font-family: inherit;
		}
		.motivo-list { border: 1px solid #eee; border-radius: 6px; padding: 8px 12px; }
		.motivo-list label {
			display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 0.9rem; cursor: pointer;
		}
		.motivo-list input { width: auto; margin: 0; }
		.msg-preview {
			margin-top: 8px; padding: 10px 12px; background: #f5f5f5; border-radius: 6px;
			font-size: 0.8rem; white-space: pre-wrap; color: #444; max-height: 140px; overflow-y: auto;
		}
		.modal-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
		.btn-wa-modal {
			display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
			background: #25D366; color: #fff; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
		}
	</style>
</head>
<body>
	<div id="login-view" class="login card">
		<h1>Brava — Admin</h1>
		<p><label>Usuario<br><input type="text" id="login-user" class="form-control brava-input" autocomplete="username"></label></p>
		<p><label>Contraseña<br><input type="password" id="login-pass" class="form-control brava-input" autocomplete="current-password"></label></p>
		<button type="button" id="login-btn">Entrar</button>
		<p class="err" id="login-err" hidden></p>
	</div>

	<div id="app-view" class="hidden">
		<div class="card">
			<h1>Órdenes <button type="button" class="btn-sm" id="logout-btn">Salir</button></h1>
			<div class="sound-bar">
				<button type="button" class="btn-sm" id="btn-sound">Activar sonido</button>
				<span id="poll-status" style="margin-left:8px;color:#666;">Actualiza ~cada 0,4 s</span>
			</div>
			<div class="tabs">
				<button type="button" class="tab active" data-estado="pendiente">Pendientes</button>
				<button type="button" class="tab" data-estado="aceptado">Aceptados</button>
				<button type="button" class="tab" data-estado="rechazado">Rechazados</button>
				<button type="button" class="tab" data-estado="entregada">Entregados</button>
				<button type="button" class="tab" data-estado="cancelada">Cancelados</button>
			</div>
			<div style="overflow-x:auto">
				<table id="orders-table">
					<thead>
						<tr>
							<th>Fecha</th><th>Cliente</th><th>Teléfono</th><th>Pago</th><th>Total</th><th>ORN</th><th>Acciones</th>
						</tr>
					</thead>
					<tbody id="tbody"></tbody>
				</table>
			</div>
			<p class="err" id="app-err" hidden></p>
		</div>
	</div>

	<div class="modal-backdrop hidden" id="rechazo-modal" role="dialog" aria-labelledby="rechazo-title">
		<div class="modal">
			<h2 id="rechazo-title">Rechazar pedido</h2>
			<p class="sub" id="rechazo-sub"></p>
			<p class="field" style="margin:0 0 4px;">Motivo (podés marcar más de uno)</p>
			<div class="motivo-list" id="rechazo-motivos">
				<label><input type="checkbox" value="Local Cerrado"> Local Cerrado</label>
				<label><input type="checkbox" value="Problemas Técnicos"> Problemas Técnicos</label>
				<label><input type="checkbox" value="TURNO LLENO"> TURNO LLENO</label>
			</div>
			<label class="field" for="rechazo-extra">Mensaje adicional</label>
			<textarea id="rechazo-extra" placeholder="Texto opcional para el cliente…"></textarea>
			<label class="field">Vista previa</label>
			<div class="msg-preview" id="rechazo-preview"></div>
			<div class="modal-foot">
				<button type="button" class="btn-sm" id="rechazo-close">Cerrar</button>
				<button type="button" class="btn-wa-modal" id="rechazo-wa"><i class="fab fa-whatsapp"></i> Enviar por WhatsApp</button>
				<button type="button" class="btn-sm btn-ok" id="rechazo-confirm" style="border-width:1px;">Confirmar rechazo</button>
			</div>
		</div>
	</div>

	<script src="/admin/admin.js?v=16"></script>
</body>
</html>
