<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="robots" content="noindex,nofollow">
	<title>Seguimiento · Brava Burgers</title>
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Brava Burgers">
	<meta property="og:title" content="Seguí tu pedido · Brava Burgers">
	<meta property="og:description" content="Mapa en vivo del repartidor, horario estimado de llegada y aviso cuando estemos en tu puerta.">
	<meta property="og:url" content="https://www.bravaburgers.com.ar/seguimiento/">
	<!-- og:image cuadrado 1024px — miniatura WhatsApp recorta a cuadrado; ≤300 KB. -->
	<meta property="og:image" content="https://www.bravaburgers.com.ar/seguimiento/wa-og.jpg?v=zoom2">
	<meta property="og:image:secure_url" content="https://www.bravaburgers.com.ar/seguimiento/wa-og.jpg?v=zoom2">
	<meta property="og:image:type" content="image/jpeg">
	<meta property="og:image:width" content="1024">
	<meta property="og:image:height" content="1024">
	<meta property="og:image:alt" content="Brava Burgers">
	<meta property="og:locale" content="es_AR">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Seguí tu pedido · Brava Burgers">
	<meta name="twitter:description" content="Mapa en vivo y llegada estimada de tu pedido Brava.">
	<meta name="twitter:image" content="https://www.bravaburgers.com.ar/seguimiento/wa-og.jpg?v=zoom2">
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
	<style>
		:root {
			--brava: #ff6b35;
			--bg: #0f1214;
			--surface: #1a2026;
			--line: #2a343c;
			--text: #e8eef2;
			--muted: #8fa3b0;
			--ok: #43a047;
			--wait: #ffb300;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100dvh;
			font-family: 'DM Sans', system-ui, sans-serif;
			background: var(--bg);
			color: var(--text);
			display: flex;
			flex-direction: column;
		}
		.top {
			padding: 16px 18px 12px;
			background: var(--surface);
			border-bottom: 1px solid var(--line);
		}
		.brand {
			font-family: 'Bebas Neue', sans-serif;
			font-size: 1.5rem;
			letter-spacing: 0.08em;
			color: var(--brava);
		}
		.orn { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
		main { flex: 1; padding: 14px 16px 12px; max-width: 480px; width: 100%; margin: 0 auto; }
		.card {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 16px;
			padding: 16px;
			margin-bottom: 12px;
		}
		.card h1 { margin: 0 0 6px; font-size: 1.05rem; }
		.card p { margin: 0; font-size: 0.88rem; color: var(--muted); line-height: 1.45; }
		.card.wait h1 { color: var(--wait); }
		.card.ok h1 { color: var(--ok); }
		.steps { display: flex; gap: 4px; margin-bottom: 14px; }
		.step { flex: 1; min-width: 72px; text-align: center; font-size: 0.62rem; color: var(--muted); }
		.step .dot {
			width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line);
			margin: 0 auto 4px; font-size: 0.6rem; display: flex; align-items: center; justify-content: center;
		}
		.step.on .dot { border-color: var(--brava); background: rgba(255,107,53,0.2); }
		.step.done .dot { border-color: var(--ok); color: var(--ok); }
		.step.on { color: var(--text); font-weight: 600; }
		#map-wrap {
			display: none;
			height: min(52vh, 340px);
			border-radius: 14px;
			overflow: hidden;
			border: 1px solid var(--line);
			margin-bottom: 10px;
		}
		#map-wrap.is-on { display: block; }
		#map { width: 100%; height: 100%; }
		.map-note {
			font-size: 0.72rem;
			color: var(--muted);
			padding: 10px 12px;
			border-radius: 10px;
			background: rgba(41,182,246,0.08);
			border: 1px solid rgba(41,182,246,0.2);
			line-height: 1.35;
			margin-bottom: 8px;
		}
		.map-wait {
			font-size: 0.78rem;
			color: var(--muted);
			text-align: center;
			padding: 12px;
			display: none;
		}
		.map-wait.is-on { display: block; }
		.err { text-align: center; padding: 40px 16px; color: var(--muted); }
		.foot {
			text-align: center;
			font-size: 0.68rem;
			color: var(--muted);
			padding: 6px 16px calc(10px + env(safe-area-inset-bottom));
			line-height: 1.35;
		}
		.live-toast {
			position: fixed;
			left: 16px;
			right: 16px;
			bottom: calc(52px + env(safe-area-inset-bottom));
			max-width: 420px;
			margin: 0 auto;
			padding: 12px 14px;
			border-radius: 12px;
			background: rgba(67, 160, 71, 0.95);
			color: #fff;
			font-size: 0.88rem;
			font-weight: 600;
			text-align: center;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
			z-index: 20;
			animation: toast-in 0.35s ease;
		}
		@keyframes toast-in {
			from { opacity: 0; transform: translateY(12px); }
			to { opacity: 1; transform: translateY(0); }
		}
		.maplibregl-ctrl-attrib { font-size: 8px !important; max-width: 100%; }
		.pin-home, .pin-driver {
			width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
			font-size: 14px; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.35);
		}
		.pin-home { background: #29b6f6; }
		.pin-driver { background: var(--brava); }
	</style>
</head>
<body>
	<header class="top">
		<div class="brand">BRAVA BURGERS</div>
		<div class="orn" id="hdr-orn">Seguimiento de pedido</div>
	</header>
	<main id="main">
		<p class="err">Cargando…</p>
	</main>
	<div class="foot" id="foot-live">Mapa © OpenStreetMap · CARTO · Actualización en vivo</div>
	<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
	<script>
	(function () {
		var MAP_STYLE = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json';
		var token = (function () {
			try {
				return new URLSearchParams(window.location.search).get('t') || '';
			} catch (e) {
				return '';
			}
		})();
		var main = document.getElementById('main');
		var hdr = document.getElementById('hdr-orn');
		var map = null;
		var markerHome = null;
		var markerDriver = null;
		var destCoords = null;
		var destGeocodePromise = null;
		var mapReady = false;
		var lastData = null;
		var lastRouteKey = '';
		var routeFetchInFlight = false;
		var didFitRoute = false;
		var OSRM = 'https://router.project-osrm.org/route/v1/driving/';
		var pollTimer = null;
		var loadInFlight = false;
		/** Distancia GPS repartidor → domicilio para mostrar "está cerca" (no confirmar llegada). */
		var NEAR_DEST_M = 180;
		var lastDistToDestM = null;
		var lastEtaMin = null;
		var lastEtaSec = null;

		function formatEtaArrivalRange(etaSeconds) {
			if (etaSeconds == null || etaSeconds <= 0) return null;
			var arrival = new Date(Date.now() + etaSeconds * 1000);
			arrival.setSeconds(0, 0);
			var end = new Date(arrival.getTime() + 5 * 60000);
			var opts = {
				timeZone: 'America/Argentina/Buenos_Aires',
				hour: '2-digit',
				minute: '2-digit',
				hour12: false,
			};
			var startStr = arrival.toLocaleTimeString('es-AR', opts);
			var endStr = end.toLocaleTimeString('es-AR', opts);
			return startStr + ' - ' + endStr;
		}

		function etaDescLine(etaSec, fallbackText) {
			var range = formatEtaArrivalRange(etaSec);
			if (range) return 'Llegada estimada: ' + range;
			return fallbackText;
		}

		function haversineM(a, b) {
			var R = 6371000;
			var toRad = Math.PI / 180;
			var dLat = (b.lat - a.lat) * toRad;
			var dLng = (b.lng - a.lng) * toRad;
			var x =
				Math.sin(dLat / 2) * Math.sin(dLat / 2) +
				Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
			return 2 * R * Math.asin(Math.sqrt(x));
		}

		function driverDistToDestM(data, dest) {
			if (!dest || !data || !data.driver_live || data.track_lat == null || data.track_lng == null) {
				return null;
			}
			return haversineM(
				{ lat: Number(data.track_lat), lng: Number(data.track_lng) },
				{ lat: dest.lat, lng: dest.lng }
			);
		}

		function firstName(s) {
			s = String(s || '').trim();
			return s ? s.split(/\s+/)[0] : '';
		}

		function stepIndex(status) {
			if (status === 'entregada') return 3;
			if (status === 'en_camino') return 2;
			if (status === 'en_cola') return 1;
			return 0;
		}

		function renderSteps(active) {
			var labels = ['Preparación', 'En ruta', 'Hacia vos', 'Entregado'];
			var html = '<div class="steps">';
			for (var i = 0; i < labels.length; i++) {
				var cls = 'step';
				if (i < active) cls += ' done';
				if (i === active) cls += ' on';
				var icon = i < active ? '✓' : String(i + 1);
				html += '<div class="' + cls + '"><div class="dot">' + icon + '</div>' + labels[i] + '</div>';
			}
			html += '</div>';
			return html;
		}

		function statusCopy(data, opts) {
			opts = opts || {};
			var distM = opts.distToDestM != null ? opts.distToDestM : lastDistToDestM;
			var etaSec = opts.etaSec != null ? opts.etaSec : lastEtaSec;
			var cardClass = 'card';
			var title = 'Estado del pedido';
			var desc = '';
			if (data.status === 'entregada') {
				cardClass += ' ok';
				title = '¡Pedido entregado!';
				desc = 'Gracias por elegir Brava.';
			} else if (data.status === 'en_camino') {
				if (data.repartidor_llegada_at) {
					title = 'El repartidor está en la puerta';
					desc = 'Te lo entregamos en unos minutos.';
				} else if (distM != null && distM <= NEAR_DEST_M) {
					title = 'El repartidor está cerca';
					desc = etaDescLine(etaSec, 'En unos minutos llega a tu puerta.');
				} else {
					title = 'Tu pedido va en camino';
					desc = etaDescLine(etaSec, 'El repartidor está yendo hacia tu domicilio.');
				}
			} else if (data.status === 'en_cola') {
				cardClass += ' wait';
				title = 'Tu pedido va en la ruta';
				desc =
					'Primero entregamos otras paradas. Cuando salgamos hacia vos te avisamos por WhatsApp.';
			} else {
				title = 'Estamos preparando tu pedido';
				desc = 'Cuando el repartidor inicie el recorrido vas a poder seguirlo desde acá.';
			}
			return { cardClass: cardClass, title: title, desc: desc };
		}

		function fullAddr(data) {
			var p = [data.direccion || ''];
			if (data.piso) p.push('Piso ' + data.piso);
			if (data.localidad) p.push(data.localidad);
			p.push('Provincia de Buenos Aires', 'Argentina');
			return p.filter(Boolean).join(', ');
		}

		function geocodeDest(data) {
			if (destCoords) return Promise.resolve(destCoords);
			if (destGeocodePromise) return destGeocodePromise;
			destGeocodePromise = fetch(
				'/api/address-suggest?mode=geocode&q=' +
					encodeURIComponent(fullAddr(data)) +
					(data.localidad ? '&loc=' + encodeURIComponent(data.localidad) : '')
			)
				.then(function (r) {
					return r.json();
				})
				.then(function (j) {
					if (j.ok && j.lat != null && j.lng != null) {
						destCoords = { lat: Number(j.lat), lng: Number(j.lng) };
						return destCoords;
					}
					return null;
				})
				.catch(function () {
					return null;
				});
			return destGeocodePromise;
		}

		function ensureMap(data) {
			if (!data.tracking_live || !window.maplibregl) return;
			var wrap = document.getElementById('map-wrap');
			var waitEl = document.getElementById('map-wait');
			if (!wrap) return;
			wrap.classList.add('is-on');
			if (!map) {
				map = new maplibregl.Map({
					container: 'map',
					style: MAP_STYLE,
					center: [-58.49, -34.51],
					zoom: 13,
					attributionControl: true,
				});
				map.on('load', function () {
					mapReady = true;
					placeMarkers(data);
				});
			} else if (mapReady) {
				placeMarkers(data);
			}
			if (waitEl) {
				waitEl.classList.toggle('is-on', data.tracking_live && !data.driver_live);
			}
		}

		function makeMarkerEl(cls, emoji) {
			var el = document.createElement('div');
			el.className = cls;
			el.textContent = emoji;
			return el;
		}

		function routeKey(from, to) {
			return (
				from.lng.toFixed(4) +
				',' +
				from.lat.toFixed(4) +
				'>' +
				to.lng.toFixed(4) +
				',' +
				to.lat.toFixed(4)
			);
		}

		function drawRouteGeometry(geometry) {
			if (!map || !mapReady || !geometry) return;
			var feat = { type: 'Feature', geometry: geometry };
			if (map.getSource('route')) {
				map.getSource('route').setData(feat);
			} else {
				map.addSource('route', { type: 'geojson', data: feat });
				map.addLayer({
					id: 'route-line',
					type: 'line',
					source: 'route',
					layout: { 'line-join': 'round', 'line-cap': 'round' },
					paint: { 'line-color': '#ff6b35', 'line-width': 5, 'line-opacity': 0.88 },
				});
			}
		}

		function fetchOsrmRoute(from, to) {
			var url =
				OSRM +
				from.lng +
				',' +
				from.lat +
				';' +
				to.lng +
				',' +
				to.lat +
				'?overview=full&geometries=geojson&steps=false';
			return fetch(url)
				.then(function (r) {
					return r.json();
				})
				.then(function (data) {
					if (data.routes && data.routes[0] && data.routes[0].geometry) {
						var dur = Number(data.routes[0].duration);
						if (!isNaN(dur) && dur > 0) {
							lastEtaSec = dur;
							lastEtaMin = Math.max(1, Math.round(dur / 60));
						}
						return data.routes[0].geometry;
					}
					throw new Error('no_route');
				});
		}

		function maybeUpdateRoute(from, to) {
			if (!from || !to) return;
			var key = routeKey(from, to);
			if (key === lastRouteKey || routeFetchInFlight) return;
			lastRouteKey = key;
			routeFetchInFlight = true;
			fetchOsrmRoute(from, to)
				.then(function (geom) {
					drawRouteGeometry(geom);
					if (lastData && lastData.ok) refreshTrackingUi(lastData);
				})
				.catch(function () {
					drawRouteGeometry({
						type: 'LineString',
						coordinates: [
							[from.lng, from.lat],
							[to.lng, to.lat],
						],
					});
				})
				.finally(function () {
					routeFetchInFlight = false;
				});
		}

		function refreshTrackingUi(data) {
			if (!data || !data.ok || !data.tracking_live) return;
			geocodeDest(data).then(function (dest) {
				lastDistToDestM = driverDistToDestM(data, dest);
				var copy = statusCopy(data, { distToDestM: lastDistToDestM, etaSec: lastEtaSec });
				var card = main.querySelector('.card');
				if (card) {
					var h1 = card.querySelector('h1');
					var p = card.querySelector('p.status-desc');
					if (h1) h1.textContent = copy.title;
					if (p) p.textContent = copy.desc;
				}
			});
		}

		function placeMarkers(data) {
			geocodeDest(data).then(function (dest) {
				lastDistToDestM = driverDistToDestM(data, dest);
				if (dest && !markerHome) {
					markerHome = new maplibregl.Marker({ element: makeMarkerEl('pin-home', '🏠') })
						.setLngLat([dest.lng, dest.lat])
						.addTo(map);
				} else if (dest && markerHome) {
					markerHome.setLngLat([dest.lng, dest.lat]);
				}
				if (data.driver_live && data.track_lng != null && data.track_lat != null) {
					var from = { lng: data.track_lng, lat: data.track_lat };
					if (!markerDriver) {
						markerDriver = new maplibregl.Marker({ element: makeMarkerEl('pin-driver', '🛵') })
							.setLngLat([from.lng, from.lat])
							.addTo(map);
					} else {
						markerDriver.setLngLat([from.lng, from.lat]);
					}
					if (dest) {
						maybeUpdateRoute(from, dest);
						refreshTrackingUi(data);
						if (!didFitRoute) {
							var bounds = new maplibregl.LngLatBounds();
							bounds.extend([dest.lng, dest.lat]);
							bounds.extend([from.lng, from.lat]);
							map.fitBounds(bounds, { padding: 52, maxZoom: 15, duration: 800 });
							didFitRoute = true;
						}
					}
				} else if (dest && !didFitRoute) {
					map.flyTo({ center: [dest.lng, dest.lat], zoom: 14, duration: 600 });
					didFitRoute = true;
				}
			});
		}

		function teardownMap() {
			if (map) {
				try {
					map.remove();
				} catch (e) {}
				map = null;
			}
			mapReady = false;
			markerHome = null;
			markerDriver = null;
			lastRouteKey = '';
			didFitRoute = false;
		}

		function uiSignature(data) {
			if (!data || !data.ok) return '';
			var phase = 'road';
			if (data.repartidor_llegada_at) phase = 'door';
			else if (lastDistToDestM != null && lastDistToDestM <= NEAR_DEST_M) phase = 'near';
			return [
				data.status,
				data.tracking_live ? '1' : '0',
				data.repartidor_llegada_at ? '1' : '0',
				phase,
				lastEtaSec != null ? String(Math.round(lastEtaSec / 60)) : '',
			].join('|');
		}

		function showDeliveredToast() {
			var old = document.getElementById('live-toast');
			if (old) old.remove();
			var el = document.createElement('div');
			el.id = 'live-toast';
			el.className = 'live-toast';
			el.textContent = '¡Pedido entregado! Gracias por elegir Brava.';
			document.body.appendChild(el);
			setTimeout(function () {
				if (el.parentNode) el.parentNode.removeChild(el);
			}, 5200);
		}

		function pollIntervalMs(data) {
			if (!data || !data.ok) return 12000;
			if (data.status === 'entregada') return 90000;
			if (data.tracking_live) return 5000;
			if (data.status === 'en_cola') return 10000;
			return 12000;
		}

		function schedulePoll() {
			if (pollTimer) clearInterval(pollTimer);
			pollTimer = setInterval(load, pollIntervalMs(lastData));
		}

		function renderShell(data) {
			if (!data.ok) {
				teardownMap();
				main.innerHTML = '<p class="err">Link inválido o vencido. Escribinos por WhatsApp si necesitás ayuda.</p>';
				return;
			}
			lastData = data;
			hdr.textContent = 'Pedido ' + (data.orn || '') + (data.parada ? ' · Parada ' + data.parada : '');
			var n = firstName(data.cliente);
			var greet = n ? '<p style="margin:0 0 10px;font-size:0.85rem;color:var(--muted)">Hola, ' + n + '</p>' : '';
			var mapNote = '';
			if (data.tracking_live) {
				mapNote =
					'<p class="map-note">Ubicación en vivo solo mientras entregamos tu parada. Se apaga al confirmar la entrega.</p>';
			}
			var mapBlock =
				data.tracking_live
					? '<div id="map-wrap"><div id="map"></div></div><p class="map-wait" id="map-wait">Esperando señal GPS del repartidor…</p>'
					: '';

			function paintShell(copy) {
				teardownMap();
				main.innerHTML =
					renderSteps(stepIndex(data.status)) +
					'<div class="' +
					copy.cardClass +
					'">' +
					greet +
					'<h1>' +
					copy.title +
					'</h1><p class="status-desc">' +
					copy.desc +
					'</p></div>' +
					mapNote +
					mapBlock;
				if (data.tracking_live) {
					ensureMap(data);
				}
			}

			if (data.tracking_live) {
				geocodeDest(data).then(function (dest) {
					lastDistToDestM = driverDistToDestM(data, dest);
					paintShell(statusCopy(data, { distToDestM: lastDistToDestM, etaSec: lastEtaSec }));
				});
			} else {
				lastDistToDestM = null;
				lastEtaMin = null;
				lastEtaSec = null;
				paintShell(statusCopy(data));
			}
		}

		function updateLive(data) {
			if (!data.ok) return;
			lastData = data;
			var waitEl = document.getElementById('map-wait');
			if (waitEl) waitEl.classList.toggle('is-on', data.tracking_live && !data.driver_live);
			if (data.tracking_live && mapReady) {
				placeMarkers(data);
				refreshTrackingUi(data);
			} else if (data.tracking_live && !map) renderShell(data);
			var foot = document.getElementById('foot-live');
			if (foot && data.tracking_live) {
				foot.textContent = 'Mapa © OpenStreetMap · CARTO · Actualizando cada ~5 s';
			}
		}

		function applySeguimientoData(data) {
			if (!data || !data.ok) {
				renderShell(data || { ok: false });
				schedulePoll();
				return;
			}
			var prev = lastData;
			var uiChanged = !prev || !prev.ok || uiSignature(prev) !== uiSignature(data);
			if (prev && prev.ok && prev.status !== 'entregada' && data.status === 'entregada') {
				showDeliveredToast();
			}
			if (uiChanged) {
				renderShell(data);
			} else if (data.tracking_live) {
				updateLive(data);
			} else {
				lastData = data;
			}
			schedulePoll();
		}

		function load() {
			if (!token) {
				main.innerHTML = '<p class="err">Falta el link de seguimiento (abrilo desde el WhatsApp de Brava).</p>';
				return;
			}
			if (loadInFlight) return;
			loadInFlight = true;
			fetch('/api/seguimiento?t=' + encodeURIComponent(token), { cache: 'no-store' })
				.then(function (r) {
					return r.json().then(function (j) {
						return { status: r.status, body: j };
					});
				})
				.then(function (pack) {
					if (pack.status === 401 || pack.status === 410) {
						main.innerHTML = '<p class="err">Este link venció. Pedinos uno nuevo por WhatsApp.</p>';
						return;
					}
					if (pack.status === 404 || (pack.body && pack.body.error === 'order_not_found')) {
						main.innerHTML =
							'<p class="err">No encontramos este pedido. Si acabás de hacerlo, esperá un minuto y recargá.</p>';
						return;
					}
					if (pack.status >= 500) {
						main.innerHTML =
							'<p class="err">Seguimiento temporalmente no disponible. Recargá en unos segundos o escribinos por WhatsApp.</p>';
						return;
					}
					applySeguimientoData(pack.body);
				})
				.catch(function () {
					if (!lastData) {
						main.innerHTML = '<p class="err">No pudimos cargar el seguimiento. Reintentá en unos segundos.</p>';
					}
				})
				.finally(function () {
					loadInFlight = false;
				});
		}

		load();
		document.addEventListener('visibilitychange', function () {
			if (document.visibilityState === 'visible') load();
		});
	})();
	</script>
</body>
</html>
